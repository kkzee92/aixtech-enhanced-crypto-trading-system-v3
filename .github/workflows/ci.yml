name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: PYTHONPATH=src pytest tests/ -q --cov=src --cov-fail-under=70
      - name: Secret scan stub
        run: echo "gitleaks-style scan would run here"
